<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 RINTU'S POOKIE ARMY 🌸</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0011, #1a0020, #0a0011);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      max-width: 1100px;
      width: 100%;
      background: rgba(255, 20, 147, 0.06);
      border: 2px solid rgba(255, 105, 180, 0.25);
      border-radius: 30px;
      padding: 40px;
      backdrop-filter: blur(10px);
    }
    h1 {
      text-align: center;
      font-size: 3em;
      background: linear-gradient(135deg, #ff69b4, #ff1493);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
    }
    .subtitle {
      text-align: center;
      color: #ffb6c1;
      font-size: 1em;
      letter-spacing: 4px;
      margin-bottom: 25px;
    }
    .subtitle span { color: #ff69b4; font-weight: bold; }
    .status-card {
      background: rgba(255, 105, 180, 0.05);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      border: 1px solid rgba(255, 105, 180, 0.1);
      margin-bottom: 20px;
    }
    .status-card .icon { font-size: 2.5em; display: block; }
    .status-card .msg { color: #ffb6c1; font-size: 1.1em; margin: 5px 0; }
    .status-card .detail { color: #ff69b488; font-size: 0.85em; }
    .input-area {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 15px 0;
    }
    .input-area textarea {
      padding: 14px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 105, 180, 0.25);
      background: rgba(255, 255, 255, 0.03);
      color: #ffe4ec;
      font-size: 0.9em;
      flex: 2;
      min-width: 250px;
      min-height: 80px;
      outline: none;
      resize: vertical;
      font-family: inherit;
    }
    .input-area textarea:focus { border-color: #ff69b4; }
    .input-area textarea::placeholder { color: #ffb6c155; }
    .input-area input {
      padding: 14px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 105, 180, 0.25);
      background: rgba(255, 255, 255, 0.03);
      color: #ffe4ec;
      font-size: 1em;
      flex: 1;
      min-width: 150px;
      outline: none;
    }
    .input-area input:focus { border-color: #ff69b4; }
    .input-area input::placeholder { color: #ffb6c155; }
    .input-area button {
      padding: 14px 25px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff69b4, #ff1493);
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 1em;
      transition: 0.3s;
    }
    .input-area button:hover { transform: scale(1.03); box-shadow: 0 0 30px rgba(255,20,147,0.3); }
    .input-area button.green { background: linear-gradient(135deg, #00cc88, #009966); }
    .input-area button.green:hover { box-shadow: 0 0 30px rgba(0,204,136,0.3); }
    .input-area button.red { background: linear-gradient(135deg, #ff4444, #cc0000); }
    .input-area button.red:hover { box-shadow: 0 0 30px rgba(255,68,68,0.3); }
    .input-area button.orange { background: linear-gradient(135deg, #ff8800, #cc6600); }
    .input-area button.purple { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
    .input-area button.purple:hover { box-shadow: 0 0 30px rgba(155,89,182,0.3); }
    .input-area button.blast { background: linear-gradient(135deg, #ff0000, #cc0000); animation: pulse 1s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    #tokenList {
      margin-top: 15px;
      color: #ffb6c1;
      max-height: 300px;
      overflow-y: auto;
    }
    .token-item {
      background: rgba(255, 105, 180, 0.04);
      padding: 10px 18px;
      margin: 6px 0;
      border-radius: 12px;
      border-left: 3px solid #ff69b4;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .token-item .online { color: #00ffcc; }
    .token-item .offline { color: #ff69b488; }
    .token-item .error { color: #ff4444; }
    .token-item .invc { color: #ff8800; }
    .token-item .blast { color: #ff0000; font-weight: bold; }
    .token-item .remove {
      background: none;
      border: none;
      color: #ff444488;
      cursor: pointer;
      font-size: 1.2em;
    }
    .token-item .remove:hover { color: #ff4444; }
    .footer {
      text-align: center;
      margin-top: 30px;
      color: #ffb6c133;
      font-size: 0.75em;
      border-top: 1px solid rgba(255, 105, 180, 0.06);
      padding-top: 20px;
    }
    .footer strong { color: #ff69b466; }
    .tab-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 15px 0;
    }
    .tab-btn {
      padding: 10px 25px;
      border: 1px solid rgba(255,105,180,0.2);
      background: rgba(255,20,147,0.05);
      color: #ffb6c188;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
      font-size: 1em;
    }
    .tab-btn:hover { background: rgba(255,105,180,0.1); }
    .tab-btn.active {
      background: linear-gradient(135deg, #ff69b4, #ff1493);
      color: white;
      border-color: #ff69b4;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .bot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }
    .bot-card {
      background: rgba(255,105,180,0.05);
      border-radius: 14px;
      padding: 15px;
      text-align: center;
      border: 1px solid rgba(255,105,180,0.08);
    }
    .bot-card .name { color: #ff69b4; font-weight: bold; font-size: 0.9em; }
    .bot-card .status { font-size: 0.75em; color: #ffb6c188; margin: 5px 0; }
    .bot-card .controls {
      display: flex;
      gap: 4px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .bot-card .controls button {
      padding: 4px 10px;
      font-size: 0.65em;
      border: 1px solid rgba(255,105,180,0.2);
      background: rgba(255,20,147,0.05);
      color: #ffb6c1;
      border-radius: 8px;
      cursor: pointer;
    }
    .bot-card .controls button:hover { background: rgba(255,105,180,0.15); }
    .bot-card .controls button.blast-btn { background: rgba(255,0,0,0.2); color: #ff4444; }
    .invite-area {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 15px 0;
    }
    .invite-area input {
      padding: 14px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 105, 180, 0.25);
      background: rgba(255, 255, 255, 0.03);
      color: #ffe4ec;
      font-size: 1em;
      flex: 2;
      min-width: 180px;
      outline: none;
    }
    .invite-area input::placeholder { color: #ffb6c155; }
    .invite-area button {
      padding: 14px 25px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff8800, #cc6600);
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 1em;
      transition: 0.3s;
    }
    .invite-area button:hover { transform: scale(1.03); box-shadow: 0 0 30px rgba(255,136,0,0.3); }
    .count-badge {
      background: rgba(255,105,180,0.15);
      padding: 2px 12px;
      border-radius: 20px;
      font-size: 0.7em;
      color: #ffb6c1;
      margin-left: 8px;
    }
    .section-title {
      color: #ff69b4;
      font-size: 0.9em;
      margin: 10px 0 5px 0;
      text-align: left;
    }
    @media (max-width: 600px) {
      .container { padding: 20px; }
      h1 { font-size: 2em; }
      .input-area textarea { min-width: 100%; }
      .input-area input { min-width: 100%; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>🌸 POOKIE ARMY 🌸</h1>
  <div class="subtitle">💖 <span>RINTU'S PRIVATE</span> · NO RULES · ALL CUTE 💖</div>
  
  <div class="status-card">
    <span class="icon">🚀</span>
    <div class="msg" id="statusMsg">⏳ Loading...</div>
    <div class="detail" id="detailMsg">Connecting to server</div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('tokens')">🪙 Tokens <span class="count-badge" id="tokenCount">0</span></button>
    <button class="tab-btn" onclick="switchTab('bots')">🎮 Bots <span class="count-badge" id="botCount">0</span></button>
    <button class="tab-btn" onclick="switchTab('music')">🎵 Music</button>
    <button class="tab-btn" onclick="switchTab('invite')">🔗 Invite</button>
    <button class="tab-btn" onclick="switchTab('rename')">✏️ Rename</button>
  </div>

  <!-- TOKENS TAB -->
  <div id="tab-tokens" class="tab-content active">
    <div class="input-area">
      <textarea id="tokenInput" placeholder="Paste multiple tokens here...&#10;One per line"></textarea>
    </div>
    <div class="input-area">
      <button onclick="addTokens()" class="purple">📥 Add All</button>
      <button onclick="startAll()" class="green">🚀 Start All</button>
      <button onclick="stopAll()" class="red">⏹️ Stop All</button>
      <button onclick="removeAllTokens()" class="red">🗑️ Remove All</button>
    </div>
    <div id="tokenList"><div style="color:#ffb6c155; text-align:center; padding:15px;">💖 No tokens yet</div></div>
  </div>

  <!-- BOTS TAB -->
  <div id="tab-bots" class="tab-content">
    <div class="bot-grid" id="botGrid">
      <div style="color:#ffb6c155; text-align:center; padding:20px; grid-column:1/-1;">💤 No active bots</div>
    </div>
  </div>

  <!-- MUSIC TAB -->
  <div id="tab-music" class="tab-content">
    <div style="text-align:center;">
      <div style="color:#ffb6c1; margin-bottom:15px;">🎵 Control ALL bots music at once</div>
      <div class="input-area">
        <input id="musicQuery" placeholder="YouTube URL or search term..." style="flex:2; min-width:200px;">
        <button onclick="playAll()" class="green">▶️ Play All</button>
        <button onclick="stopAllMusic()" class="red">⏹️ Stop All</button>
        <button onclick="blastAll()" class="blast">💥 BLAST ALL</button>
      </div>
      <div style="color:#ffb6c155; font-size:0.85em; margin-top:10px;">
        💥 BLAST MODE = 20000% VOLUME + LOOP
      </div>
    </div>
  </div>

  <!-- INVITE TAB -->
  <div id="tab-invite" class="tab-content">
    <div style="text-align:center;">
      <div class="invite-area">
        <input id="inviteInput" placeholder="discord.gg/xxxx or invite code">
        <button onclick="inviteJoin()">🚀 Join All Bots</button>
        <button onclick="leaveAll()" class="red">🚪 Leave All</button>
      </div>
      <div style="color:#ffb6c155; font-size:0.85em;">💖 All active bots will join the server from invite</div>
    </div>
  </div>

  <!-- RENAME TAB -->
  <div id="tab-rename" class="tab-content">
    <div style="text-align:center;">
      <input id="newNameInput" placeholder="New name for all bots..." style="padding:14px 20px; border-radius:14px; border:1px solid rgba(255,105,180,0.25); background:rgba(255,255,255,0.03); color:#ffe4ec; font-size:1em; width:80%; max-width:400px; outline:none;">
      <br><br>
      <button onclick="renameAll()" class="green">🔄 Rename All</button>
    </div>
  </div>

  <div class="footer">🌸 <strong>RINTU'S ARMY</strong> · v10.0 · SELFBOT MUSIC ARMY 💕</div>
</div>

<script>
  var authToken = '';
  var allTokens = [];
  var allBots = [];
  
  function switchTab(tabName) {
    var tabs = document.querySelectorAll('.tab-btn');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].classList.remove('active');
    }
    var contents = document.querySelectorAll('.tab-content');
    for (var i = 0; i < contents.length; i++) {
      contents[i].classList.remove('active');
    }
    var tabButtons = document.querySelectorAll('.tab-btn');
    for (var i = 0; i < tabButtons.length; i++) {
      if (tabButtons[i].getAttribute('onclick') === "switchTab('" + tabName + "')") {
        tabButtons[i].classList.add('active');
        break;
      }
    }
    document.getElementById('tab-' + tabName).classList.add('active');
    if (tabName === 'bots') { loadBots(); }
    if (tabName === 'tokens') { loadTokens(); }
  }

  function apiCall(endpoint, method, body) {
    return new Promise(function(resolve, reject) {
      method = method || 'GET';
      var opts = {
        method: method,
        headers: {
          'Authorization': authToken,
          'Content-Type': 'application/json'
        }
      };
      if (body) { opts.body = JSON.stringify(body); }
      fetch(endpoint, opts)
        .then(function(res) { return res.json(); })
        .then(function(data) { resolve(data); })
        .catch(function(err) { reject(err); });
    });
  }

  function autoLogin() {
    document.getElementById('statusMsg').textContent = '⏳ Logging in...';
    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: 'rintu', password: 'pookie' })
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data.token) {
        authToken = data.token;
        document.getElementById('statusMsg').textContent = '✅ Connected!';
        document.getElementById('detailMsg').textContent = 'Selfbot Army Ready! 🚀';
        loadTokens();
        loadBots();
        setInterval(loadTokens, 5000);
        setInterval(loadBots, 5000);
      } else {
        document.getElementById('statusMsg').textContent = '❌ Login failed';
        document.getElementById('detailMsg').textContent = 'Use rintu/pookie';
      }
    })
    .catch(function(err) {
      document.getElementById('statusMsg').textContent = '⚠️ Connection error';
      document.getElementById('detailMsg').textContent = 'Retrying...';
      setTimeout(autoLogin, 3000);
    });
  }

  function addTokens() {
    var textarea = document.getElementById('tokenInput');
    var raw = textarea.value.trim();
    if (!raw) { alert('🌸 Paste at least one token!'); return; }
    var tokenList = raw.split(/[\n,]+/).map(function(t) { return t.trim(); }).filter(function(t) { return t.length > 0; });
    if (tokenList.length === 0) { alert('🌸 No valid tokens found!'); return; }
    document.getElementById('statusMsg').textContent = '⏳ Adding ' + tokenList.length + ' tokens...';
    apiCall('/api/add-tokens-bulk', 'POST', { tokens: tokenList })
      .then(function(data) {
        if (data.success) {
          textarea.value = '';
          document.getElementById('statusMsg').textContent = '✅ Added ' + data.added + ' tokens!';
          loadTokens();
        } else {
          alert('❌ ' + (data.error || 'Failed'));
        }
      });
  }

  function loadTokens() {
    if (!authToken) return;
    apiCall('/api/status')
      .then(function(data) {
        allTokens = data || [];
        var container = document.getElementById('tokenList');
        var countEl = document.getElementById('tokenCount');
        countEl.textContent = allTokens.length;
        if (!allTokens || allTokens.length === 0) {
          container.innerHTML = '<div style="color:#ffb6c155; text-align:center; padding:15px;">💖 No tokens yet</div>';
          return;
        }
        var html = '';
        for (var i = 0; i < allTokens.length; i++) {
          var t = allTokens[i];
          var statusClass = t.status === 'active' ? 'online' : (t.status === 'error' ? 'error' : 'offline');
          var statusText = t.status === 'active' ? '🩷 ONLINE' : (t.status === 'error' ? '❌ ERROR' : '💤 OFFLINE');
          if (t.inVC) { statusText += ' 🔊'; }
          if (t.blastMode) { statusText += ' 💥BLAST'; }
          html += '<div class="token-item">';
          html += '<span>🔑 ' + t.id.slice(-8) + ' <span style="font-size:0.7em;color:#ffb6c155;">' + (t.username || '') + '</span></span>';
          html += '<span class="' + statusClass + '">' + statusText + '</span>';
          html += '<button class="remove" onclick="removeToken(\'' + t.id + '\')">✕</button>';
          html += '</div>';
        }
        container.innerHTML = html;
      });
  }

  function removeToken(id) {
    if (!confirm('Remove this token?')) return;
    apiCall('/api/remove-token', 'POST', { id: id })
      .then(function(data) {
        if (data.success) { loadTokens(); }
      });
  }

  function removeAllTokens() {
    if (!confirm('⚠️ Remove ALL tokens?')) return;
    apiCall('/api/remove-all-tokens', 'POST')
      .then(function(data) {
        if (data.success) { loadTokens(); loadBots(); }
      });
  }

  function startAll() {
    document.getElementById('statusMsg').textContent = '🚀 Starting all bots...';
    apiCall('/api/start-all', 'POST')
      .then(function(data) {
        document.getElementById('statusMsg').textContent = '🚀 Started ' + (data.started || 0) + '/' + (data.total || 0) + ' bot(s)!';
        loadTokens();
        loadBots();
      });
  }

  function stopAll() {
    document.getElementById('statusMsg').textContent = '⏹️ Stopping all bots...';
    apiCall('/api/stop-all', 'POST')
      .then(function(data) {
        document.getElementById('statusMsg').textContent = '⏹️ Stopped ' + (data.stopped || 0) + ' bot(s)';
        loadTokens();
        loadBots();
      });
  }

  function loadBots() {
    if (!authToken) return;
    apiCall('/api/bots')
      .then(function(data) {
        allBots = data || [];
        var container = document.getElementById('botGrid');
        var countEl = document.getElementById('botCount');
        countEl.textContent = allBots.length;
        if (!allBots || allBots.length === 0) {
          container.innerHTML = '<div style="color:#ffb6c155; text-align:center; padding:20px; grid-column:1/-1;">💤 No active bots</div>';
          return;
        }
        var html = '';
        for (var i = 0; i < allBots.length; i++) {
          var b = allBots[i];
          var vcStatus = b.inVC ? '🔊 In VC' : '💤 Idle';
          var blastStatus = b.blastMode ? '💥 BLAST' : '';
          html += '<div class="bot-card">';
          html += '<div class="name">' + (b.username || 'Bot') + '</div>';
          html += '<div class="status">' + vcStatus + ' ' + blastStatus + '</div>';
          html += '<div class="controls">';
          html += '<button onclick="botAction(\'' + b.id + '\',\'join\')">🔊 Join</button>';
          html += '<button onclick="botAction(\'' + b.id + '\',\'leave\')">🚪 Leave</button>';
          html += '<button onclick="botAction(\'' + b.id + '\',\'volume\',\'200\')">🔊 20000%</button>';
          html += '<button onclick="botAction(\'' + b.id + '\',\'blast\')" class="blast-btn">💥 BLAST</button>';
          html += '</div></div>';
        }
        container.innerHTML = html;
      });
  }

  function botAction(id, action, value) {
    value = value || null;
    apiCall('/api/bot-action', 'POST', { id: id, action: action, value: value })
      .then(function(data) {
        if (data.success) { loadBots(); loadTokens(); }
      });
  }

  function playAll() {
    var query = document.getElementById('musicQuery').value.trim();
    if (!query) { alert('🌸 Enter a song name or URL!'); return; }
    document.getElementById('statusMsg').textContent = '🎵 Playing on all bots...';
    apiCall('/api/play-all', 'POST', { query: query })
      .then(function(data) {
        document.getElementById('statusMsg').textContent = '🎵 ' + (data.played || 0) + ' bot(s) playing!';
      });
  }

  function stopAllMusic() {
    apiCall('/api/stop-all-music', 'POST')
      .then(function(data) {
        document.getElementById('statusMsg').textContent = '⏹️ Stopped all music';
      });
  }

  function blastAll() {
    document.getElementById('statusMsg').textContent = '💥 BLAST MODE ACTIVATED!';
    // Set volume to max on all bots
    apiCall('/api/blast-all', 'POST')
      .then(function(data) {
        document.getElementById('statusMsg').textContent = '💥 BLAST MODE ON ' + (data.blasted || 0) + ' bots!';
        loadBots();
      });
  }

  function renameAll() {
    var name = document.getElementById('newNameInput').value.trim();
    if (!name) { alert('🌸 Enter a name!'); return; }
    document.getElementById('statusMsg').textContent = '✏️ Renaming...';
    apiCall('/api/rename-all', 'POST', { name: name })
      .then(function(data) {
        document.getElementById('statusMsg').textContent = '✏️ Renamed ' + (data.renamed || 0) + ' bot(s)!';
        loadBots();
        loadTokens();
      });
  }

  function inviteJoin() {
    var invite = document.getElementById('inviteInput').value.trim();
    if (!invite) { alert('🌸 Enter an invite code!'); return; }
    document.getElementById('statusMsg').textContent = '🚀 Joining...';
    apiCall('/api/invite-join', 'POST', { invite: invite })
      .then(function(data) {
        document.getElementById('statusMsg').textContent = '🚀 ' + (data.joined || 0) + ' bot(s) joined!';
        loadBots();
      });
  }

  function leaveAll() {
    document.getElementById('statusMsg').textContent = '🚪 Leaving...';
    apiCall('/api/leave-all', 'POST')
      .then(function(data) {
        document.getElementById('statusMsg').textContent = '🚪 ' + (data.left || 0) + ' bot(s) left';
        loadBots();
      });
  }

  window.onload = function() {
    autoLogin();
  };
</script>
</body>
</html>
