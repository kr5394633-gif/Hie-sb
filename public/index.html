<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 POOKIE ARMY 🌸</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0011, #1a0020, #0a0011);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 20, 147, 0.06);
            border: 2px solid rgba(255, 105, 180, 0.25);
            border-radius: 30px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        h1 { text-align: center; font-size: 2.5em; background: linear-gradient(135deg, #ff69b4, #ff1493); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { text-align: center; color: #ffb6c1; font-size: 0.9em; letter-spacing: 4px; margin-bottom: 20px; }
        .subtitle span { color: #ff69b4; font-weight: bold; }
        .status-card {
            background: rgba(255, 105, 180, 0.05);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(255, 105, 180, 0.1);
            margin-bottom: 15px;
        }
        .status-card .msg { color: #ffb6c1; font-size: 1em; }
        .status-card .detail { color: #ff69b488; font-size: 0.8em; }
        .stats-row {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        .stat-box {
            background: rgba(255,105,180,0.04);
            padding: 8px 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(255,105,180,0.06);
        }
        .stat-box .num { color: #ff69b4; font-size: 1.5em; font-weight: bold; }
        .stat-box .label { color: #ffb6c188; font-size: 0.7em; text-transform: uppercase; }
        .input-area {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 10px 0;
        }
        .input-area textarea {
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 105, 180, 0.25);
            background: rgba(255, 255, 255, 0.03);
            color: #ffe4ec;
            font-size: 0.9em;
            flex: 2;
            min-width: 200px;
            min-height: 80px;
            outline: none;
            resize: vertical;
            font-family: inherit;
        }
        .input-area textarea:focus { border-color: #ff69b4; }
        .input-area textarea::placeholder { color: #ffb6c155; }
        .input-area button {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9em;
            transition: 0.3s;
        }
        .input-area button:hover { transform: scale(1.03); box-shadow: 0 0 20px rgba(255,20,147,0.3); }
        .input-area button.green { background: linear-gradient(135deg, #00cc88, #009966); }
        .input-area button.red { background: linear-gradient(135deg, #ff4444, #cc0000); }
        .input-area button.purple { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
        .input-area button.orange { background: linear-gradient(135deg, #ff8800, #cc6600); }
        .token-list {
            margin-top: 10px;
            color: #ffb6c1;
            max-height: 250px;
            overflow-y: auto;
            font-size: 0.85em;
        }
        .token-item {
            background: rgba(255, 105, 180, 0.04);
            padding: 8px 14px;
            margin: 3px 0;
            border-radius: 8px;
            border-left: 3px solid #ff69b4;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .token-item .online { color: #00ffcc; }
        .token-item .offline { color: #ff69b488; }
        .token-item .error { color: #ff4444; }
        .token-item .starting { color: #ffcc00; }
        .token-item .tag { color: #ffb6c155; font-size: 0.7em; }
        .token-item .remove {
            background: none;
            border: none;
            color: #ff444488;
            cursor: pointer;
            font-size: 1em;
        }
        .token-item .remove:hover { color: #ff4444; }
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #ffb6c133;
            font-size: 0.7em;
            border-top: 1px solid rgba(255, 105, 180, 0.06);
            padding-top: 15px;
        }
        .footer strong { color: #ff69b466; }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
        }
        .status-dot.online { background: #00ffcc; }
        .status-dot.offline { background: #ff69b488; }
        .status-dot.error { background: #ff4444; }
        .status-dot.starting { background: #ffcc00; animation: blink 0.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>
<div class="container">
    <h1>🌸 POOKIE ARMY 🌸</h1>
    <div class="subtitle">💖 <span>RINTU'S PRIVATE</span> · NO RULES · ALL CUTE 💖</div>
    
    <div class="status-card">
        <div class="msg" id="statusMsg">⏳ Connecting...</div>
        <div class="detail" id="detailMsg">Loading dashboard</div>
    </div>

    <div class="stats-row">
        <div class="stat-box"><div class="num" id="statTokens">0</div><div class="label">Tokens</div></div>
        <div class="stat-box"><div class="num" id="statBots">0</div><div class="label">Online Bots</div></div>
        <div class="stat-box"><div class="num" id="statVC">0</div><div class="label">In VC</div></div>
    </div>

    <div style="margin: 15px 0;">
        <div class="input-area">
            <textarea id="tokenInput" placeholder="Paste Discord tokens here...&#10;One per line"></textarea>
        </div>
        <div class="input-area">
            <button onclick="addTokens()" class="purple">📥 Add & Start</button>
            <button onclick="startAll()" class="green">🚀 Start All</button>
            <button onclick="stopAll()" class="red">⏹️ Stop All</button>
            <button onclick="removeAllTokens()" class="red">🗑️ Remove All</button>
            <button onclick="refreshStatus()" class="orange">🔄 Refresh</button>
        </div>
    </div>

    <div class="token-list" id="tokenList"><div style="color:#ffb6c155; text-align:center; padding:10px;">💖 No tokens yet</div></div>

    <div class="footer">🌸 <strong>RINTU'S ARMY</strong> · v3.0 · REAL SELFBOTS 💕</div>
</div>

<script>
let authToken = '';
let allTokens = [];

// ===== LOGIN =====
function autoLogin() {
    document.getElementById('statusMsg').textContent = '⏳ Logging in...';
    fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: 'rintu', password: 'pookie' })
    })
    .then(r => r.json())
    .then(data => {
        if (data.token) {
            authToken = data.token;
            document.getElementById('statusMsg').textContent = '✅ Connected!';
            document.getElementById('detailMsg').textContent = 'Add tokens to start bots! 🚀';
            loadTokens();
            loadStatus();
            setInterval(loadTokens, 5000);
            setInterval(loadStatus, 5000);
        } else {
            document.getElementById('statusMsg').textContent = '❌ Login failed';
        }
    })
    .catch(err => {
        document.getElementById('statusMsg').textContent = '⚠️ Error';
        console.error('Login error:', err);
        setTimeout(autoLogin, 3000);
    });
}

function apiCall(endpoint, method, body) {
    return new Promise((resolve, reject) => {
        const opts = {
            method: method || 'GET',
            headers: { 'Authorization': authToken, 'Content-Type': 'application/json' }
        };
        if (body) opts.body = JSON.stringify(body);
        fetch(endpoint, opts)
            .then(r => r.json())
            .then(resolve)
            .catch(reject);
    });
}

// ===== ADD TOKENS =====
function addTokens() {
    const raw = document.getElementById('tokenInput').value.trim();
    if (!raw) { alert('🌸 Paste at least one token!'); return; }
    
    const tokenList = raw.split(/[\n,]+/).map(t => t.trim()).filter(t => t.length > 10);
    if (tokenList.length === 0) {
        alert('🌸 No valid tokens! Tokens should be at least 10 characters.');
        return;
    }
    
    document.getElementById('statusMsg').textContent = '⏳ Adding ' + tokenList.length + ' tokens...';
    
    apiCall('/api/add-tokens', 'POST', { tokens: tokenList, autoStart: true })
        .then(data => {
            if (data.success) {
                document.getElementById('tokenInput').value = '';
                document.getElementById('statusMsg').textContent = '✅ Added ' + data.added + ' tokens!';
                document.getElementById('detailMsg').textContent = data.message || 'Success!';
                loadTokens();
                loadStatus();
            } else {
                alert('❌ ' + (data.error || 'Failed'));
                document.getElementById('statusMsg').textContent = '❌ Failed';
            }
        })
        .catch(err => {
            alert('❌ Network error: ' + err.message);
            document.getElementById('statusMsg').textContent = '❌ Error';
        });
}

// ===== LOAD TOKENS =====
function loadTokens() {
    if (!authToken) return;
    apiCall('/api/tokens')
        .then(data => {
            allTokens = data || [];
            document.getElementById('statTokens').textContent = allTokens.length;
            const container = document.getElementById('tokenList');
            if (allTokens.length === 0) {
                container.innerHTML = '<div style="color:#ffb6c155; text-align:center; padding:10px;">💖 No tokens yet</div>';
                return;
            }
            let html = '';
            for (let t of allTokens) {
                let statusClass = t.status;
                let statusText = t.status.toUpperCase();
                if (t.status === 'active') { statusText = '🩷 ONLINE'; statusClass = 'online'; }
                else if (t.status === 'inactive') { statusText = '💤 OFFLINE'; statusClass = 'offline'; }
                else if (t.status === 'error') { statusText = '❌ ERROR'; statusClass = 'error'; }
                else if (t.status === 'starting' || t.status === 'pending') { statusText = '⏳ STARTING'; statusClass = 'starting'; }
                else { statusText = '❓ UNKNOWN'; statusClass = 'offline'; }
                
                html += `<div class="token-item">
                    <span>
                        <span class="status-dot ${statusClass}"></span>
                        🔑 ${t.id.slice(-8)}
                        <span class="tag">${t.tag || t.username || ''}</span>
                    </span>
                    <span class="${statusClass}">${statusText}</span>
                    <button class="remove" onclick="removeToken('${t.id}')">✕</button>
                </div>`;
            }
            container.innerHTML = html;
        })
        .catch(err => console.error('Load tokens error:', err));
}

function removeToken(id) {
    if (!confirm('Remove this token?')) return;
    apiCall('/api/remove-token', 'POST', { id }).then(() => { loadTokens(); loadStatus(); });
}

function removeAllTokens() {
    if (!confirm('⚠️ Remove ALL tokens?')) return;
    apiCall('/api/remove-all-tokens', 'POST').then(() => { loadTokens(); loadStatus(); });
}

function startAll() {
    document.getElementById('statusMsg').textContent = '🚀 Starting all bots...';
    apiCall('/api/start-all', 'POST').then(data => {
        document.getElementById('statusMsg').textContent = '🚀 Started ' + (data.started || 0) + ' bot(s)!';
        loadTokens();
        loadStatus();
    });
}

function stopAll() {
    document.getElementById('statusMsg').textContent = '⏹️ Stopping all bots...';
    apiCall('/api/stop-all', 'POST').then(data => {
        document.getElementById('statusMsg').textContent = '⏹️ Stopped ' + (data.stopped || 0) + ' bot(s)';
        loadTokens();
        loadStatus();
    });
}

function loadStatus() {
    if (!authToken) return;
    apiCall('/api/status').then(data => {
        document.getElementById('statTokens').textContent = data.totalTokens || 0;
        document.getElementById('statBots').textContent = data.activeBots || 0;
        document.getElementById('statVC').textContent = data.inVC || 0;
    });
}

function refreshStatus() {
    loadTokens();
    loadStatus();
    document.getElementById('statusMsg').textContent = '🔄 Refreshed!';
    setTimeout(() => {
        document.getElementById('statusMsg').textContent = '✅ Connected!';
    }, 2000);
}

window.onload = function() {
    autoLogin();
};
</script>
</body>
</html>
